services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  ai:
    build: ./ai-service
    ports: ["8000:8000"]
  server:
    build: ./server
    environment:
      MONGO_URI: mongodb://mongo:27017/hiresense
      AI_URL: http://ai:8000
      JWT_SECRET: portfolio-demo
      PORT: 5000
    ports: ["5000:5000"]
    depends_on: [mongo, ai]
  client:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:5000
    ports: ["4173:4173"]
    depends_on: [server]
volumes:
  mongo_data:
